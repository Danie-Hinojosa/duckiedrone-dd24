# MAVROS on the laptop, connected to PX4 SITL (PX4 offboard port: 14540 -> 14580).
# Same plugins Duckietown uses on the drone, and thrust_scaling = 1.0 for setpoint_raw
# (on the drone, dd-tof-fix takes care of that).
/mavros_node:
  ros__parameters:
    fcu_url: "udp://:14540@127.0.0.1:14580"
    gcs_url: ""
/mavros:
  ros__parameters:
    plugin_allowlist:
      - actuator_control
      - altitude
      - command
      - ftp
      - global_position
      - home_position
      - imu
      - local_position
      - manual_control
      - param
      - rc_io
      - setpoint_attitude
      - setpoint_position
      - setpoint_raw
      - setpoint_velocity
      - sys_status
      - sys_time
      - distance_sensor
/mavros/setpoint_raw:
  ros__parameters:
    thrust_scaling: 1.0
/mavros/setpoint_attitude:
  ros__parameters:
    use_quaternion: true

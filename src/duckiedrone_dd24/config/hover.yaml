# Parámetros de hover_test (se pueden cambiar sin tocar el código).
# -1.0 = sin valor (hover se mide al despegar; thrust_max = hover + 0.2).
dd_hover_test:
  ros__parameters:
    hover: -1.0
    kp: 0.25
    ki: 0.15
    kd: 0.10
    i_max: 2.0
    thrust_min: 0.05
    thrust_max: -1.0
    thrust_slew: 1.0
    climb_rate: 0.3
    descent_rate: 0.25
    find_rate: 0.12
    find_max: 0.6
    find_max_tilt: 4.0
    min_battery: 50.0
    log: /tmp/hover_test.csv
